<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hortifruti</title>
    <link rel="stylesheet" href="src/css/estilo.css">
</head>
<body>
    <header>
        <h1>Hortifruti</h1>
        <p>Frutas frescas e qualidade todos os dias!</p>
    </header>
    <main>
    </main>
<section class="banner">
    <h2>Mais saúde no seu dia!</h2>
    <p>
        Confira nossas frutas e aproveite
        o melhor da natureza.
    </p>
</section>
<section class="produtos">
    <h2>Nossas frutas</h2>
    <section class="busca">
        <input
            type="text"
            id="busca"
            placeholder="Digite o nome de uma fruta..."
            maxlength="30"
        >
        <button id="btn-buscar">Buscar</button>
        <p id="mensagem"></p>
    </section>
    <section id="grid" class="grid"></section>
</section>
</body>
</html>
